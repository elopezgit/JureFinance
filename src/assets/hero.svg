<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" role="img" aria-label="Dos capas superpuestas: venta, costo real y cobro">
  <defs>
    <linearGradient id="jf-borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c96a4f" />
      <stop offset="0.55" stop-color="#8c2f22" />
      <stop offset="1" stop-color="#d8a35c" />
    </linearGradient>
    <linearGradient id="jf-cara" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fffdf9" />
      <stop offset="1" stop-color="#f1e7d6" />
    </linearGradient>
    <linearGradient id="jf-canto-claro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8dcc9" />
      <stop offset="1" stop-color="#d8c8b0" />
    </linearGradient>
    <pattern id="jf-vetas" width="9" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 0 L4 18" stroke="#fffdf9" stroke-opacity="0.3" stroke-width="1.4" />
      <path d="M7 0 L6 18" stroke="#2a2622" stroke-opacity="0.13" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Hilos que unen las capas: precio de venta → costo real → cobro -->
  <g stroke="#b9a58f" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="3 4">
    <line x1="25" y1="68" x2="25" y2="122" />
    <line x1="175" y1="68" x2="175" y2="122" />
  </g>

  <!-- Capa superior: la propuesta al cliente -->
  <g>
    <path d="M24 56 Q24 60 32 64 L90 91 Q100 96 110 91 L168 64 Q176 60 176 56 L176 64 Q176 68 168 72 L110 99 Q100 104 90 99 L32 72 Q24 68 24 64 Z" fill="url(#jf-canto-claro)" />
    <path d="M100 14 Q104 14 110 17 L168 48 Q176 52 176 56 Q176 60 168 64 L110 91 Q100 96 90 91 L32 64 Q24 60 24 56 Q24 52 32 48 L90 17 Q96 14 100 14 Z" fill="url(#jf-cara)" stroke="#c9b9a5" stroke-width="1.2" />
  </g>

  <!-- Capa inferior: los números reales, con el canto terracota -->
  <g>
    <path d="M24 120 Q24 124 32 128 L90 155 Q100 160 110 155 L168 128 Q176 124 176 120 L176 136 Q176 140 168 144 L110 171 Q100 176 90 171 L32 144 Q24 140 24 136 Z" fill="url(#jf-borde)" />
    <path d="M24 120 Q24 124 32 128 L90 155 Q100 160 110 155 L168 128 Q176 124 176 120 L176 136 Q176 140 168 144 L110 171 Q100 176 90 171 L32 144 Q24 140 24 136 Z" fill="url(#jf-vetas)" opacity="0.75" />
    <path d="M100 80 Q104 80 110 83 L168 114 Q176 118 176 122 Q176 126 168 130 L110 157 Q100 162 90 157 L32 130 Q24 126 24 122 Q24 118 32 114 L90 83 Q96 80 100 80 Z" fill="url(#jf-cara)" stroke="#c9b9a5" stroke-width="1.2" />
  </g>
</svg>
